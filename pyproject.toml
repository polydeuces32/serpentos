[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "serpentos"
version = "2.0.0"
description = "An embedded policy runtime — define, validate, audit, replay and compare decision policies — with a Q-learning snake game as its reference environment."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = [
  "policy",
  "decision-engine",
  "rules-engine",
  "audit",
  "replay",
  "snake",
  "reinforcement-learning",
  "q-learning",
  "terminal",
  "agent",
]
classifiers = [
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Arcade",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# The runtime and the learning core are pure standard library. windows-curses is
# only needed for the terminal UI; everything else runs anywhere Python does.
dependencies = ["windows-curses>=2.3.0; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/polydeuces32/serpentos"
Issues = "https://github.com/polydeuces32/serpentos/issues"

[project.scripts]
serpentos = "serpentos.__main__:main"

[tool.setuptools]
packages = [
  "serpentos",
  "serpentos.runtime",
  "serpentos.policies",
  "serpentos.environments",
  "serpentos.environments.snake",
]
