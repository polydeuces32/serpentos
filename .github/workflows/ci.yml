name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  library:
    name: public API works from an installed wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel
        shell: bash
        run: pip install dist/*.whl
      - name: Import and decide, outside the source tree
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -c "
          from serpentos import ActionValidator, DecisionContext, DecisionEngine, InMemoryAuditLog, replay
          from serpentos.policies import Rule, RulePolicy, when

          policy = RulePolicy(
              name='retry-policy', version='1.0',
              rules=[Rule('retry', when('status_code', 'in', [503, 504]))],
              default_action='fail',
          )
          audit = InMemoryAuditLog()
          engine = DecisionEngine(policy, validator=ActionValidator({'retry', 'fail'}), audit_sink=audit)
          decision = engine.decide(DecisionContext({'attempts': 2, 'status_code': 503}))
          assert decision.action == 'retry', decision.action
          assert replay(policy, audit.records[0]).match
          print('library API ok:', decision.action)
          "
      - name: The runtime does not drag in curses or the game
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -c "
          import sys, serpentos
          leaked = [m for m in sys.modules if m in ('curses', 'serpentos.core', 'serpentos.bot')]
          assert not leaked, leaked
          print('runtime is isolated')
          "
      - name: The non-Snake example runs against the installed package
        shell: bash
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/examples/retry_policy.py"
      - name: The published contract holds for the installed wheel
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -c "
          import json, os, sys, tempfile, threading
          import serpentos
          assert 'workspace' not in serpentos.__file__.lower() or 'site-packages' in serpentos.__file__
          from serpentos import (ActionValidator, AUDIT_SCHEMA_VERSION, DecisionContext,
                                 DecisionEngine, InMemoryAuditLog, JsonlAuditLog, Outcome,
                                 compare, read_jsonl, replay_all)
          from serpentos.policies import Rule, RulePolicy, when

          policy = RulePolicy(name='gate', version='1.0',
                              rules=[Rule('allow', when('score', 'ge', 50))],
                              default_action='deny')
          cases = [DecisionContext({'score': s, 'ssn': 'x'}) for s in (10, 80)]

          # Audit records carry a schema version, and unknown ones are refused.
          path = os.path.join(tempfile.mkdtemp(), 'a.jsonl')
          sink = JsonlAuditLog(path, redact=['ssn'])
          engine = DecisionEngine(policy, validator=ActionValidator({'allow','deny'}), audit_sink=sink)
          for case in cases: engine.decide(case)
          sink.close()
          rows = [json.loads(l) for l in open(path) if l.strip()]
          assert all(r['schema_version'] == AUDIT_SCHEMA_VERSION for r in rows), rows
          assert rows[0]['context']['values']['ssn'] == '[REDACTED]'
          assert replay_all(policy, list(read_jsonl(path))).matched == 2

          # Outcome carries metrics without demanding a scalar score.
          assert Outcome(True, metrics={'latency_ms': 3.0}).score is None

          # A shared engine is safe across threads.
          shared = InMemoryAuditLog()
          hot = DecisionEngine(policy, validator=ActionValidator({'allow','deny'}), audit_sink=shared)
          def work():
              for i in range(100): hot.decide(DecisionContext({'score': i}))
          ts = [threading.Thread(target=work) for _ in range(8)]
          [t.start() for t in ts]; [t.join() for t in ts]
          assert len(shared) == 800, len(shared)

          print('contract ok:', len(serpentos.__all__), 'public names, schema', AUDIT_SCHEMA_VERSION)
          "

  benchmark:
    name: benchmark is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Train a short-lived agent
        run: |
          python -m serpentos bot --data-dir "$RUNNER_TEMP/state" \
            --episodes 2000 --preset BOLD --seed 1 --quiet \
            --export-policy "$RUNNER_TEMP/policy.json" --name ci
      - name: Score it twice and require identical results
        run: |
          python -m serpentos bot --data-dir "$RUNNER_TEMP/a" --quiet \
            --bench --import-policy "$RUNNER_TEMP/policy.json" > a.json
          python -m serpentos bot --data-dir "$RUNNER_TEMP/b" --quiet \
            --bench --import-policy "$RUNNER_TEMP/policy.json" > b.json
          diff a.json b.json
          cat a.json
      - uses: actions/upload-artifact@v4
        with:
          name: policy
          path: ${{ runner.temp }}/policy.json

  package:
    name: package builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: pip install dist/*.whl
      - name: Installed console script works
        run: |
          serpentos --help
          serpentos run --help
          serpentos bot --help
          serpentos bench --help
          serpentos help
          serpentos bot --episodes 20 --data-dir "$RUNNER_TEMP/state" --quiet --json
      - name: Every subpackage ships in the wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -c "
          import serpentos, serpentos.runtime, serpentos.policies, serpentos.environments.snake
          print(serpentos.__version__, 'all subpackages present')
          "
