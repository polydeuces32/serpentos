name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  benchmark:
    name: benchmark is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Train a short-lived agent
        run: |
          python -m serpentos bot --data-dir "$RUNNER_TEMP/state" \
            --episodes 2000 --preset BOLD --seed 1 --quiet \
            --export-policy "$RUNNER_TEMP/policy.json" --name ci
      - name: Score it twice and require identical results
        run: |
          python -m serpentos bot --data-dir "$RUNNER_TEMP/a" --quiet \
            --bench --import-policy "$RUNNER_TEMP/policy.json" > a.json
          python -m serpentos bot --data-dir "$RUNNER_TEMP/b" --quiet \
            --bench --import-policy "$RUNNER_TEMP/policy.json" > b.json
          diff a.json b.json
          cat a.json
      - uses: actions/upload-artifact@v4
        with:
          name: policy
          path: ${{ runner.temp }}/policy.json

  package:
    name: package builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: pip install dist/*.whl
      - name: Installed console script works
        run: serpentos bot --episodes 20 --data-dir "$RUNNER_TEMP/state" --quiet --json
