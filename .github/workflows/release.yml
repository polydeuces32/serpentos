name: release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build distribution artifacts
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  verify-testpypi:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist
      - name: Resolve published version
        shell: bash
        run: |
          set -euo pipefail
          SERPENTOS_VERSION="$(python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("serpentos-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one serpentos wheel, found {len(wheels)}")

          with ZipFile(wheels[0]) as archive:
              metadata_files = [
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_files) != 1:
                  raise SystemExit(
                      f"expected exactly one METADATA file, found {len(metadata_files)}"
                  )
              metadata = archive.read(metadata_files[0]).decode("utf-8")

          for line in metadata.splitlines():
              if line.startswith("Version: "):
                  print(line.removeprefix("Version: "))
                  break
          else:
              raise SystemExit("package version missing from wheel metadata")
          PY
          )"
          test -n "$SERPENTOS_VERSION"
          echo "SERPENTOS_VERSION=$SERPENTOS_VERSION" >> "$GITHUB_ENV"
          echo "Will verify serpentos==$SERPENTOS_VERSION from TestPyPI"
      - name: Install SerpentOS from TestPyPI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --no-deps \
              "serpentos==$SERPENTOS_VERSION"; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "SerpentOS $SERPENTOS_VERSION was not installable from TestPyPI after 6 attempts" >&2
              exit 1
            fi
            sleep 10
          done
      - name: Smoke-test installed package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from serpentos import ActionValidator, DecisionContext, DecisionEngine
          from serpentos.policies import Rule, RulePolicy, when

          policy = RulePolicy(
              name="release-smoke",
              version="1.0",
              rules=[
                  Rule("fail", when("attempts", "ge", 3), name="give-up"),
                  Rule("retry", when("status_code", "in", [503, 504]), name="retry-5xx"),
              ],
              default_action="fail",
          )
          engine = DecisionEngine(
              policy=policy,
              validator=ActionValidator(allowed_actions={"retry", "fail"}),
          )
          decision = engine.decide(
              DecisionContext(values={"attempts": 2, "status_code": 503})
          )
          assert decision.action == "retry", decision
          print("SerpentOS runtime smoke test: PASS")
          PY
          serpentos help
          python -m serpentos help
