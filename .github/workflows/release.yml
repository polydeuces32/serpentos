name: release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build distribution artifacts
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*
          if-no-files-found: error

  check-testpypi:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      publish_needed: ${{ steps.check.outputs.publish_needed }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist
      - name: Compare exact artifacts with TestPyPI
        id: check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("serpentos-*.whl"))
          if len(wheels) != 1:
              raise SystemExit("Expected exactly one wheel")
          with ZipFile(wheels[0]) as archive:
              names = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
              if len(names) != 1:
                  raise SystemExit("Expected exactly one wheel METADATA")
              metadata = archive.read(names[0]).decode("utf-8")
          versions = [line[9:] for line in metadata.splitlines() if line.startswith("Version: ")]
          if len(versions) != 1:
              raise SystemExit("Cannot determine package version")
          version = versions[0]
          request = Request(
              f"https://test.pypi.org/pypi/serpentos/{version}/json",
              headers={"Accept": "application/json", "User-Agent": "serpentos-release-check"},
          )
          try:
              with urlopen(request, timeout=30) as response:
                  published = json.load(response)
          except HTTPError as exc:
              if exc.code == 404:
                  published = None
              else:
                  raise
          artifacts = sorted(p for p in Path("dist").iterdir() if p.is_file())
          if len(artifacts) != 2 or not any(p.name.endswith(".tar.gz") for p in artifacts):
              raise SystemExit("Expected one wheel and one sdist")
          if published is None:
              needed = "true"
              print(f"Version {version} not found on TestPyPI; publication required")
          else:
              remote = {item["filename"]: item["digests"]["sha256"] for item in published["urls"]}
              local = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in artifacts}
              if local != remote:
                  raise SystemExit(
                      "Version already exists on TestPyPI but artifacts differ; "
                      "refusing to overwrite or treat as successful. "
                      "Prepare a new version after reviewing differences."
                  )
              needed = "false"
              print(f"Exact version {version} artifacts already published; skipping upload")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish_needed={needed}\n")
          PY

  publish:
    runs-on: ubuntu-latest
    needs: check-testpypi
    if: needs.check-testpypi.outputs.publish_needed == 'true'
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  verify-testpypi:
    runs-on: ubuntu-latest
    needs: [build, check-testpypi, publish]
    if: always() && needs.build.result == 'success' && needs.check-testpypi.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist
      - name: Resolve published version
        shell: bash
        run: |
          set -euo pipefail
          SERPENTOS_VERSION="$(python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("dist").glob("serpentos-*.whl"))
          if len(wheels) != 1:
              raise SystemExit("Expected exactly one wheel")
          with ZipFile(wheels[0]) as archive:
              names = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
              if len(names) != 1:
                  raise SystemExit("Expected one METADATA file")
              metadata = archive.read(names[0]).decode("utf-8")
          versions = [line[9:] for line in metadata.splitlines() if line.startswith("Version: ")]
          if len(versions) != 1:
              raise SystemExit("Missing version")
          print(versions[0])
          PY
          )"
          echo "SERPENTOS_VERSION=$SERPENTOS_VERSION" >> "$GITHUB_ENV"
      - name: Install SerpentOS from TestPyPI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python -m pip install --index-url https://test.pypi.org/simple/ --no-deps "serpentos==$SERPENTOS_VERSION"; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done
      - name: Smoke-test installed package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from serpentos import ActionValidator, DecisionContext, DecisionEngine
          from serpentos.policies import Rule, RulePolicy, when
          policy = RulePolicy(
              name="release-smoke",
              version="1.0",
              rules=[
                  Rule("fail", when("attempts", "ge", 3), name="give-up"),
                  Rule("retry", when("status_code", "in", [503, 504]), name="retry-5xx"),
              ],
              default_action="fail",
          )
          engine = DecisionEngine(
              policy=policy,
              validator=ActionValidator(allowed_actions={"retry", "fail"}),
          )
          decision = engine.decide(
              DecisionContext(values={"attempts": 2, "status_code": 503})
          )
          assert decision.action == "retry", decision
          print("SerpentOS runtime smoke test: PASS")
          PY
          serpentos help
          python -m serpentos help
